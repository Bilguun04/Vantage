name: 'Vantage'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: vantage-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Vantage
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - vantage-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Daphne ASGI Server
  daphne:
    build: .
    container_name: vantage-daphne
    command: daphne -b 0.0.0.0 -p 8000 app.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/vantage
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,daphne,web
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vantage-network

  # Django Development Server
  web:
    build: .
    container_name: vantage-web
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/vantage
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,daphne
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vantage-network

  # Optional: MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: vantage-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
    depends_on:
      - mongodb
    networks:
      - vantage-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  vantage-network:
    driver: bridge